name: zayavka-analytics
services:
  analytics-db:
    image: postgres:18
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U analytics -d analytics]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  analytics:
    build:
      context: ../..
      dockerfile: src/analytics/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://analytics:${DB_PASSWORD:?DB_PASSWORD is required}@analytics-db:5432/analytics
      AUTH_ISSUER: ${PUBLIC_URL:-http://localhost:8080}/realms/zayavka
      AUTH_JWKS_URL: http://keycloak:8080/realms/zayavka/protocol/openid-connect/certs
      AUTH_AUDIENCE: analytics
      ROOT_PATH: /analytics
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      analytics-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
volumes:
  database:
networks:
  default:
    external: true
    name: zayavka
