input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["telemetry.logs"]
    group_id => "logstash"
    auto_offset_reset => "earliest"
    enable_auto_commit => false
    codec => json
  }
}
filter {
  ruby {
    code => '
      records = []
      (event.get("resourceLogs") || []).each do |resource|
        attributes = (resource.dig("resource", "attributes") || []).to_h { |a| [a["key"], a.dig("value", "stringValue")] }
        (resource["scopeLogs"] || []).each do |scope|
          (scope["logRecords"] || []).each do |record|
            ns = (record["timeUnixNano"] || record["observedTimeUnixNano"]).to_i
            records << {
              "@timestamp" => LogStash::Timestamp.new(Time.at(ns / 1000000000, ns % 1000000000, :nanosecond)),
              "message" => record.dig("body", "stringValue"),
              "service" => {"name" => attributes["service.name"]},
              "log" => {"level" => record["severityText"]},
              "trace" => {"id" => record["traceId"]},
              "span" => {"id" => record["spanId"]}
            }
          end
        end
      end
      event.set("records", records)
    '
  }
  split { field => "records" }
  ruby {
    code => '
      record = event.get("records")
      if record.is_a?(Hash)
        event.to_hash.keys.each { |key| event.remove(key) }
        record.each { |key, value| event.set(key, value) }
      else
        event.cancel
      end
    '
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "application-logs-%{+yyyy.MM.dd}"
  }
}
