name: zayavka-elasticsearch
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
    - elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped
volumes:
  elasticsearch: null
networks:
  default:
    name: zayavka
    external: true
