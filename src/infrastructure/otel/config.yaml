receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch: {}
exporters:
  kafka:
    brokers: [kafka:9092]
    logs:
      topic: telemetry.logs
      encoding: otlp_json
    sending_queue:
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true
  elasticsearch:
    endpoints: [http://elasticsearch:9200]
    mapping:
      allowed_modes: [otel]
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [elasticsearch]
