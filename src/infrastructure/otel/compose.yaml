name: zayavka-otel
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command:
    - --config=/etc/otelcol/config.yaml
    volumes:
    - ./config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
networks:
  default:
    name: zayavka
    external: true
