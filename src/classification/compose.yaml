name: zayavka-classification
services:
  classification:
    build:
      context: ../..
      dockerfile: src/classification/Dockerfile
    environment:
      AUTH_ISSUER: ${PUBLIC_URL:-http://localhost:8080}/realms/zayavka
      AUTH_JWKS_URL: http://keycloak:8080/realms/zayavka/protocol/openid-connect/certs
      AUTH_AUDIENCE: classification
      ROOT_PATH: /classification
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: zayavka
      KEYCLOAK_CLIENT_ID: classification-worker
      KEYCLOAK_CLIENT_SECRET: ${CLASSIFICATION_CLIENT_SECRET:?CLASSIFICATION_CLIENT_SECRET is required}
      TRAINING_API_URL: http://tickets:8000/internal/training-data
      MODEL_PATH: /data/model.joblib
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - models:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
volumes:
  models:
networks:
  default:
    external: true
    name: zayavka
