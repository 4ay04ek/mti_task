name: zayavka-keycloak
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command:
    - start-dev
    - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:8080}
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD}
      APP_EMPLOYEE_PASSWORD: ${APP_EMPLOYEE_PASSWORD:?Set APP_EMPLOYEE_PASSWORD}
      APP_EXECUTOR_PASSWORD: ${APP_EXECUTOR_PASSWORD:?Set APP_EXECUTOR_PASSWORD}
      TICKETS_CLIENT_SECRET: ${TICKETS_CLIENT_SECRET:?Set TICKETS_CLIENT_SECRET}
      CLASSIFICATION_CLIENT_SECRET: ${CLASSIFICATION_CLIENT_SECRET:?Set CLASSIFICATION_CLIENT_SECRET}
    volumes:
    - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
  keycloak-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
    - keycloak-db:/var/lib/postgresql
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - keycloak
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  keycloak-db: null
networks:
  default:
    name: zayavka
    external: true
