events {}
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream tickets { zone tickets 64k; server tickets:8000 resolve; }
    upstream analytics { zone analytics 64k; server analytics:8000 resolve; }
    upstream classification { zone classification 64k; server classification:8000 resolve; }
    upstream keycloak { zone keycloak 64k; server keycloak:8080 resolve; }
    server {
        listen 8080;
        server_name _;
        access_log off;
        client_max_body_size 1m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location /api/ { proxy_pass http://tickets/; }
        location = /analytics { proxy_pass http://analytics/; }
        location /analytics/ { proxy_pass http://analytics/; }
        location /classification/ {
            proxy_read_timeout 300s;
            proxy_pass http://classification/;
        }
        location ~ ^/(realms|resources|admin)/ { proxy_pass http://keycloak; }
        location = /health { return 200 'ok'; }
    }
}
